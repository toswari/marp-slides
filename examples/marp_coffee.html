:root {
  --accent: #c4956a;
  --accent-hover: #d4a87d;
  --dark: #1a1210;
  --card: #241c17;
  --border: #3a2e25;
  --muted: #8a7a6a;
  --light: #f5e6d3;
  --cream: #e8d5bf;
  --espresso: #4a3628;
}

section {
  background: var(--dark);
  color: var(--light);
  font-family: 'Work Sans', sans-serif;
  font-weight: 400;
  padding: 60px 80px;
  line-height: 1.6;
}

h1 {
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  font-size: 3.2em;
  color: var(--accent);
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin-bottom: 0.2em;
}

h2 {
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  font-size: 1.7em;
  color: var(--light);
  margin-bottom: 0.4em;
}

h3 {
  font-family: 'Space Mono', monospace;
  font-weight: 400;
  font-size: 0.75em;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.2em;
  margin-bottom: 0.1em;
}

strong { color: var(--accent); font-weight: 600; }

section.lead {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: radial-gradient(ellipse at 50% 80%, #2a1e15 0%, var(--dark) 70%);
}
section.lead h1 { font-size: 3.6em; }
section.lead p { color: var(--muted); font-size: 1em; }

.method-card {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 16px;
  text-align: center;
}
.method-card h4 {
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  font-size: 0.9em;
  color: var(--light);
  margin: 10px 0 12px;
}

.meter-label {
  font-size: 0.6em;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 4px;
}

.step-circle {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--card);
  border: 2px solid var(--accent);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;

:root {
  --accent: #c4956a;
  --accent-hover: #d4a87d;
  --dark: #1a1210;
  --card: #241c17;
  --border: #3a2e25;
  --muted: #8a7a6a;
  --light: #f5e6d3;
  --cream: #e8d5bf;
  --espresso: #4a3628;
}

section {
  background: var(--dark);
  color: var(--light);
  font-family: 'Work Sans', sans-serif;
  font-weight: 400;
  padding: 60px 80px;
  line-height: 1.6;
}

h1 {
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  font-size: 3.2em;
  color: var(--accent);
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin-bottom: 0.2em;
}

h2 {
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  font-size: 1.7em;
  color: var(--light);
  margin-bottom: 0.4em;
}

h3 {
  font-family: 'Space Mono', monospace;
  font-weight: 400;
  font-size: 0.75em;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.2em;
  margin-bottom: 0.1em;
}

strong { color: var(--accent); font-weight: 600; }

section.lead {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: radial-gradient(ellipse at 50% 80%, #2a1e15 0%, var(--dark) 70%);
}
section.lead h1 { font-size: 3.6em; }
section.lead p { color: var(--muted); font-size: 1em; }

.method-card {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 16px;
  text-align: center;
}
.method-card h4 {
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  font-size: 0.9em;
  color: var(--light);
  margin: 10px 0 12px;
}

.meter-label {
  font-size: 0.6em;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 4px;
}

.step-circle {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--card);
  border: 2px solid var(--accent);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.step-num {
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  font-size: 1.1em;
  color: var(--accent);
  line-height: 1;
}

@keyframes steam {
  0%, 100% { transform: translateY(0); opacity: 0.6; }
  50% { transform: translateY(-6px); opacity: 1; }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.divider {
  width: 50px;
  height: 3px;
  background: var(--accent);
  border-radius: 2px;
  margin: 12px auto 16px;
}
